<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-light">
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Pedidos de mi unidad</h1>
            <a th:href="@{/responsable/pedido}" class="btn btn-dark">Nuevo pedido</a>
        </div>

        <!-- mensaje que llega por flash despues de cargar un pedido -->
        <div class="alert alert-success" th:if="${exito}" th:text="${exito}">exito</div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}">error</div>


        <!-- ===== buscador por fecha ===== -->
        <form method="get" th:action="@{/responsable/pedidos}" class="card shadow-sm mb-4">
            <div class="card-body d-flex flex-wrap align-items-end gap-3">
                <div>
                    <label for="desde" class="form-label mb-1 small text-muted">Desde</label>
                    <input type="date" id="desde" name="desde" class="form-control" th:value="${desde}"/>
                </div>
                <div>
                    <label for="hasta" class="form-label mb-1 small text-muted">Hasta</label>
                    <input type="date" id="hasta" name="hasta" class="form-control" th:value="${hasta}"/>
                </div>
                <button type="submit" class="btn btn-dark">Filtrar</button>
                <a th:href="@{/responsable/pedidos}" class="btn btn-outline-secondary"
                   th:if="${desde != null or hasta != null}">Limpiar</a>
            </div>
        </form>

        <div class="card shadow-sm" th:if="${pedidos != null and !#lists.isEmpty(pedidos)}">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr><th>#</th><th>Fecha</th><th>Detalle</th><th class="text-end">Total</th></tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${pedidos}">
                        <td th:text="${p.idPedido}">1</td>
                        <td th:text="${#temporals.format(p.fecha,'dd/MM/yyyy')}">fecha</td>
                        <td>
                            <div th:each="i : ${p.items}" th:text="${i.cantidad} + ' × ' + ${i.plato.nombre}">2 × plato</div>
                        </td>
                        <td class="text-end fw-semibold"
                            th:text="'$ ' + ${#numbers.formatDecimal(p.total,1,'POINT',2,'COMMA')}">0</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p class="text-muted" th:if="${pedidos != null and #lists.isEmpty(pedidos)}">
            <span th:if="${desde == null and hasta == null}">Todavía no hay pedidos cargados.</span>
            <span th:unless="${desde == null and hasta == null}">No hay pedidos en ese rango de fechas.</span>
        </p>
        <a th:href="@{/responsable}" class="btn btn-outline-secondary mt-4">Volver</a>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
