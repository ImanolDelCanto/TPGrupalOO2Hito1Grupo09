<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-light">
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Pedidos de mi unidad</h1>
            <a th:href="@{/responsable/pedido}" class="btn btn-dark">Nuevo pedido</a>
        </div>

        <!-- mensaje que llega por flash despues de cargar un pedido -->
        <div class="alert alert-success" th:if="${exito}" th:text="${exito}">exito</div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}">error</div>

        <div class="card shadow-sm" th:if="${pedidos != null and !#lists.isEmpty(pedidos)}">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr><th>#</th><th>Fecha</th><th>Detalle</th><th class="text-end">Total</th></tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${pedidos}">
                        <td th:text="${p.idPedido}">1</td>
                        <td th:text="${#temporals.format(p.fecha,'dd/MM/yyyy')}">fecha</td>
                        <td>
                            <div th:each="i : ${p.items}" th:text="${i.cantidad} + ' × ' + ${i.plato.nombre}">2 × plato</div>
                        </td>
                        <td class="text-end fw-semibold"
                            th:text="'$ ' + ${#numbers.formatDecimal(p.total,1,'POINT',2,'COMMA')}">0</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p class="text-muted" th:if="${pedidos != null and #lists.isEmpty(pedidos)}">
            Todavía no hay pedidos cargados.
        </p>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
