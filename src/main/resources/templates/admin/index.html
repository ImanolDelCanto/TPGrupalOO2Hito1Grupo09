<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-light">
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-5">
           <h1 class="h3 mb-4">Festivales</h1>
           <div class="alert alert-danger" th:if="${error}" th:text="${error}">error</div>

        <!-- una card por festival: estado, fechas y cuantas unidades tiene -->
        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="f : ${festivales}">
                <div class="card h-100 shadow-sm" th:classappend="${f.estaActivo()} ? 'border-success border-2'">
                    <img class="card-img-top" style="height:140px;object-fit:cover"
                         th:if="${f.imagenUrl != null}" th:src="${f.imagenUrl}" th:alt="${f.nombre}"/>
                    <div class="bg-secondary-subtle" style="height:140px" th:unless="${f.imagenUrl != null}"></div>
                    <div class="card-body d-flex flex-column">
                        <div class="mb-2">
                            <span class="badge bg-success" th:if="${f.estaActivo()}">En curso</span>
                            <span class="badge bg-primary" th:if="${f.estaPorEmpezar()}">Próximo</span>
                            <span class="badge bg-light text-dark border" th:if="${f.estaFinalizado()}">Finalizado</span>
                            <span class="badge bg-secondary" th:text="${f.temporada}">TEMPORADA</span>
                        </div>
                        <h5 class="card-title mb-1" th:text="${f.nombre}">Nombre</h5>
                        <p class="text-muted small mb-3">
                            <span th:text="${#temporals.format(f.fechaInicio,'dd/MM/yyyy')}">inicio</span>
                            al
                            <span th:text="${#temporals.format(f.fechaFin,'dd/MM/yyyy')}">fin</span>
                            &middot; <span th:text="${f.diasDuracion} + ' días'">días</span>
                            &middot; <span th:text="${#sets.size(f.unidades)} + ' unidades'">unidades</span>
                        </p>
                        <a th:href="@{/reportes/unidades(idFestival=${f.idFestival})}"
                           class="btn btn-dark w-100 mt-auto">Administrar</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
