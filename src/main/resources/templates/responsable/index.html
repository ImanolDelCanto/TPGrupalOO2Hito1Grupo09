<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-light">
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-5">
        <h1 class="h3 mb-4">Mi unidad de venta</h1>

        <div class="card shadow-sm" style="max-width:640px" th:if="${unidad}">
            <div class="card-body p-4">
                <h2 class="h5 mb-1" th:text="${unidad.nombreComercial}">nombre</h2>
                <p class="text-muted mb-3">
                    Código <code th:text="${unidad.codigoUnico}">cod</code>
                    &middot; <span th:text="${unidad.superficie} + ' m²'">m2</span>
                    &middot; <span th:text="${unidad.festival.nombre}">festival</span>
                </p>
                                <div class="d-flex gap-2 mb-3">
                    <a th:href="@{/responsable/pedido}" class="btn btn-dark">Nuevo pedido</a>
                    <a th:href="@{/responsable/pedidos}" class="btn btn-outline-dark">Ver pedidos</a>
                </div>
                <div class="alert alert-secondary mb-0">
                    Próximamente: alta de empleados y platos, y los reportes de la unidad.
                </div>
            </div>
        </div>

        <div class="alert alert-warning" th:unless="${unidad}">
            Tu usuario no tiene una unidad de venta asignada.
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
