<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-light">
    <nav th:replace="~{layout :: navbar}"></nav>

    <header class="py-5 bg-white border-bottom">
        <div class="container">
            <h1 class="display-5 fw-bold">Festivales gastronómicos</h1>
            <p class="lead text-muted mb-0">
                Centro de convenciones y predio ferial Epicentro Gourmet.
                Conocé los festivales y registrá tu unidad de venta.
            </p>
        </div>
    </header>

    <main class="container py-5">
        <div class="row g-4">
            <div class="col-md-6" th:each="f : ${festivales}">
                <div class="card h-100 shadow-sm">
                    <img class="card-img-top" style="height:200px;object-fit:cover"
                         th:if="${f.imagenUrl != null}" th:src="${f.imagenUrl}" th:alt="${f.nombre}"/>
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <h5 class="card-title mb-0" th:text="${f.nombre}">Nombre</h5>
                            <span class="badge bg-secondary" th:text="${f.temporada}">TEMPORADA</span>
                        </div>
                        <p class="text-muted small mb-2">
                            <span th:text="${#temporals.format(f.fechaInicio, 'dd/MM/yyyy')}">inicio</span>
                            al
                            <span th:text="${#temporals.format(f.fechaFin, 'dd/MM/yyyy')}">fin</span>
                            &middot; <span th:text="${f.diasDuracion} + ' días'">días</span>
                        </p>
                        <span class="badge bg-success mb-2" th:if="${f.estaActivo()}">En curso</span>
                        <span class="badge bg-light text-dark border mb-2" th:unless="${f.estaActivo()}">Finalizado</span>
                        <p class="card-text" th:text="${f.descripcion}">Descripción</p>
                    </div>
                </div>
            </div>
        </div>
        <p class="text-muted mt-4" th:if="${#lists.isEmpty(festivales)}">Todavía no hay festivales cargados.</p>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
