<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-light">
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-5">
        <!-- con resultado, el titulo lleva la unidad; con error, solo "Rentabilidad neta" -->
        <h1 class="h3 mb-4" th:text="${r != null} ? 'Rentabilidad neta - ' + ${r.nombreUnidad} : 'Rentabilidad neta'">Rentabilidad neta</h1>

        <!-- ===== periodo: sin fechas es el festival completo ===== -->
        <form method="get" th:action="@{/reportes/rentabilidad}" class="card shadow-sm mb-4">
            <div class="card-body d-flex flex-wrap align-items-end gap-3">
                <div>
                    <label for="desde" class="form-label mb-1 small text-muted">Desde</label>
                    <input type="date" id="desde" name="desde" class="form-control" th:value="${desde}"/>
                </div>
                <div>
                    <label for="hasta" class="form-label mb-1 small text-muted">Hasta</label>
                    <input type="date" id="hasta" name="hasta" class="form-control" th:value="${hasta}"/>
                </div>
                <button type="submit" class="btn btn-dark">Calcular</button>
                <a th:href="@{/reportes/rentabilidad}" class="btn btn-outline-secondary"
                   th:if="${desde != null or hasta != null}">Festival completo</a>

                <!-- guia: el rango del festival -->
                <p class="small text-muted w-100 mb-0" th:if="${r != null}"
                   th:text="${r.nombreFestival} + ': del ' + ${#temporals.format(r.inicioFestival,'dd/MM/yyyy')}
                            + ' al ' + ${#temporals.format(r.finFestival,'dd/MM/yyyy')} + ' (' + ${r.diasFestival} + ' días).'">rango del festival</p>
            </div>
        </form>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}">error</div>

        <div th:if="${r}">
            <div class="card shadow-sm">
                <table class="table mb-0 align-middle">
                    <tbody>
                        <tr>
                            <td>Recaudación (total de los pedidos)</td>
                            <td class="text-end" th:text="'$ ' + ${#numbers.formatDecimal(r.recaudacion, 1, 'POINT', 2, 'COMMA')}">0</td>
                        </tr>
                        <tr>
                            <td>Menos costo de los platos vendidos</td>
                            <td class="text-end" th:text="'- $ ' + ${#numbers.formatDecimal(r.costoPlatos, 1, 'POINT', 2, 'COMMA')}">0</td>
                        </tr>
                        <tr>
                            <td>Menos sueldos del staff</td>
                            <td class="text-end" th:text="'- $ ' + ${#numbers.formatDecimal(r.sueldos, 1, 'POINT', 2, 'COMMA')}">0</td>
                        </tr>
                        <tr>
                            <td>Menos canon</td>
                            <td class="text-end" th:text="'- $ ' + ${#numbers.formatDecimal(r.canon, 1, 'POINT', 2, 'COMMA')}">0</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <th>Rentabilidad neta</th>
                            <th class="text-end fs-5"
                                th:classappend="${r.rentabilidadNeta.signum() < 0} ? 'text-danger' : 'text-success'"
                                th:text="'$ ' + ${#numbers.formatDecimal(r.rentabilidadNeta, 1, 'POINT', 2, 'COMMA')}">0</th>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <!-- que periodo se calculo, abajo de la cuenta -->
            <p class="small text-muted mt-3 mb-0" th:if="${r.desde == null}"
               th:text="'Festival completo: sueldos y canon de los ' + ${r.diasFestival} + ' días.'">festival completo</p>
            <p class="small text-muted mt-3 mb-0" th:if="${r.desde != null}"
               th:text="'Del ' + ${#temporals.format(r.desde,'dd/MM/yyyy')} + ' al ' + ${#temporals.format(r.hasta,'dd/MM/yyyy')}
                        + ': ' + ${r.dias} + ' de ' + ${r.diasFestival} + ' días del festival. Sueldos y canon proporcionales a esos días.'">periodo</p>
        </div>

        <a th:href="@{/responsable}" class="btn btn-outline-secondary mt-4">Volver</a>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
