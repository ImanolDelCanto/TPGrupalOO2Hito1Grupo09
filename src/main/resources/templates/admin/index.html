<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-light">
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-5">
        <h1 class="h3 mb-4">Festivales</h1>
        <div class="card shadow-sm mb-5">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr><th>Festival</th><th>Temporada</th><th>Desde</th><th>Hasta</th><th class="text-end">Días</th></tr>
                </thead>
                <tbody>
                    <tr th:each="f : ${festivales}">
                        <td th:text="${f.nombre}">nombre</td>
                        <td><span class="badge bg-secondary" th:text="${f.temporada}">t</span></td>
                        <td th:text="${#temporals.format(f.fechaInicio,'dd/MM/yyyy')}">desde</td>
                        <td th:text="${#temporals.format(f.fechaFin,'dd/MM/yyyy')}">hasta</td>
                        <td class="text-end" th:text="${f.diasDuracion}">0</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <h2 class="h4 mb-3">Unidades de venta</h2>
        <div class="card shadow-sm">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr><th>Nombre comercial</th><th>Código</th><th>Festival</th><th class="text-end">Superficie</th></tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${unidades}">
                        <td th:text="${u.nombreComercial}">nombre</td>
                        <td><code th:text="${u.codigoUnico}">cod</code></td>
                        <td th:text="${u.festival.nombre}">festival</td>
                        <td class="text-end" th:text="${u.superficie} + ' m²'">0</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
