<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-light">
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-5">
        <h1 class="h3 mb-4">Mi unidad de venta</h1>

        <div class="card shadow-sm" th:if="${unidad}">
            <div class="card-body p-4">
                <div class="d-flex flex-wrap justify-content-between gap-3 mb-4">
                    <div>
                        <h2 class="h4 mb-1" th:text="${unidad.nombreComercial}">nombre</h2>
                        <p class="text-muted mb-1">
                            <span th:text="${unidad.tipoUnidad}">tipo</span>
                            &middot; Código <code th:text="${unidad.codigoUnico}">cod</code>
                            &middot; <span th:text="${unidad.superficie} + ' m²'">m2</span>
                        </p>
                        <p class="small text-muted mb-0" th:text="${unidad.detalleEspecifico}">detalle</p>
                    </div>
                    <div class="text-md-end">
                        <div class="fw-semibold" th:text="${unidad.festival.nombre}">festival</div>
                        <div class="small text-muted">
                            <span th:text="${#temporals.format(unidad.festival.fechaInicio,'dd/MM/yyyy')}">desde</span>
                            al
                            <span th:text="${#temporals.format(unidad.festival.fechaFin,'dd/MM/yyyy')}">hasta</span>
                        </div>
                    </div>
                </div>

                <h3 class="h6 text-uppercase text-muted mb-2">Gestión</h3>
                <div class="d-flex flex-wrap gap-2 mb-4">
                    <a th:href="@{/responsable/pedidos}" class="btn btn-outline-dark">Pedidos</a>
                    <a th:href="@{/responsable/platos}" class="btn btn-outline-dark">Menú</a>
                </div>

                <h3 class="h6 text-uppercase text-muted mb-2">Reportes</h3>
                <div class="d-flex flex-wrap gap-2">
                    <a th:href="@{/reportes/canon}" class="btn btn-outline-dark">Canon</a>
                </div>
            </div>
        </div>

        <div class="alert alert-warning" th:unless="${unidad}">
            Tu usuario no tiene una unidad de venta asignada.
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
