<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-light">
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-5" style="max-width:720px">
        <h1 class="h3 mb-1">Registrar unidad de venta</h1>
        <p class="text-muted mb-4">Completá los datos de tu unidad y creá tu usuario de responsable.</p>

        <form th:action="@{/registro/unidad}" th:object="${registro}" method="post" class="card shadow-sm">
            <div class="card-body p-4">

                <!-- errores de negocio que manda el service (email repetido, etc.) -->
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                    <p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}">error</p>
                </div>

                <!-- ===== RESPONSABLE ===== -->
                <h2 class="h6 text-uppercase text-muted mb-3">Tus datos de acceso</h2>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email (será tu usuario)</label>
                        <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{password}"></div>
                    </div>
                </div>

                <!-- ===== UNIDAD ===== -->
                <h2 class="h6 text-uppercase text-muted mb-3">Tu unidad de venta</h2>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nombreComercial" class="form-label">Nombre comercial</label>
                        <input type="text" th:field="*{nombreComercial}" class="form-control" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{nombreComercial}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="codigoUnico" class="form-label">Código único (10 caracteres)</label>
                        <input type="text" th:field="*{codigoUnico}" maxlength="10" class="form-control" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{codigoUnico}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="superficie" class="form-label">Superficie (m²)</label>
                        <input type="number" step="0.01" min="0" th:field="*{superficie}" class="form-control" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{superficie}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="idFestival" class="form-label">Festival</label>
                        <select th:field="*{idFestival}" class="form-select" th:errorclass="is-invalid">
                            <option value="">Elegí un festival</option>
                            <option th:each="f : ${festivales}" th:value="${f.idFestival}"
                                    th:text="${f.nombre + ' (' + #temporals.format(f.fechaInicio,'dd/MM') + ' al ' + #temporals.format(f.fechaFin,'dd/MM') + ')'}">festival</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{idFestival}"></div>
                    </div>
                    <div class="col-12">
                        <label for="tipo" class="form-label">Tipo de unidad</label>
                        <select th:field="*{tipo}" class="form-select" th:errorclass="is-invalid">
                            <option value="">Elegí el tipo</option>
                            <option value="FOOD_TRUCK">Food Truck</option>
                            <option value="PUESTO">Puesto desarmable</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{tipo}"></div>
                    </div>
                </div>

                <!-- solo Food Truck -->
                <div id="campos-foodtruck" class="row g-3 mt-1">
                    <div class="col-md-6">
                        <label for="patente" class="form-label">Patente</label>
                        <input type="text" th:field="*{patente}" class="form-control"/>
                    </div>
                    <div class="col-md-6 d-flex align-items-end">
                        <div class="form-check mb-2">
                            <input type="checkbox" th:field="*{requiereElectricidad}" class="form-check-input"/>
                            <label class="form-check-label" for="requiereElectricidad1">Requiere conexión eléctrica</label>
                        </div>
                    </div>
                </div>

                <!-- solo Puesto -->
                <div id="campos-puesto" class="row g-3 mt-1">
                    <div class="col-md-6">
                        <label for="cantidadCarpas" class="form-label">Cantidad de carpas</label>
                        <input type="number" min="1" th:field="*{cantidadCarpas}" class="form-control"/>
                    </div>
                    <div class="col-md-6">
                        <label for="tiempoMontaje" class="form-label">Tiempo de montaje (minutos)</label>
                        <input type="number" min="0" th:field="*{tiempoMontaje}" class="form-control"/>
                    </div>
                </div>

                <button type="submit" class="btn btn-dark w-100 mt-4">Registrar</button>
            </div>
        </form>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>

    <!-- muestra solo los campos del tipo elegido -->
    <script>
        const tipo = document.getElementById('tipo');
        function actualizarCampos() {
            document.getElementById('campos-foodtruck').hidden = tipo.value !== 'FOOD_TRUCK';
            document.getElementById('campos-puesto').hidden = tipo.value !== 'PUESTO';
        }
        tipo.addEventListener('change', actualizarCampos);
        actualizarCampos();
    </script>
</body>
</html>
