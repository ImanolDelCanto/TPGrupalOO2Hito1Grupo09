<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-light">
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-5" style="max-width:720px">
        <h1 class="h3 mb-1">
            Editar <span th:text="${unidad.nombreComercial}">unidad</span>
            <span class="badge bg-secondary fs-6 align-middle" th:text="${unidad.tipoUnidad}">tipo</span>
        </h1>
        <p class="text-muted mb-4">
            <span th:text="${unidad.festival.nombre}">festival</span>
            &middot; responsable: <span th:text="${unidad.responsable != null ? unidad.responsable.email : '-'}">email</span>
        </p>

        <!-- puede: si el festival no empezo, los datos del canon se pueden cambiar -->
        <form th:action="@{/admin/unidades/{id}/editar(id=${unidad.idUnidad})}" th:object="${datos}" method="post"
              class="card shadow-sm" th:with="puede=${unidad.puedeCambiarDatosDelCanon()}">
            <div class="card-body p-4">

                <!-- errores de negocio que manda el service -->
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                    <p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}">error</p>
                </div>

                <div class="alert alert-warning" th:unless="${puede}">
                    El festival ya empezó: la superficie, la electricidad y el montaje no se pueden cambiar
                    porque modificarían el canon ya calculado.
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nombreComercial" class="form-label">Nombre comercial</label>
                        <input type="text" th:field="*{nombreComercial}" class="form-control" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{nombreComercial}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="codigoUnico" class="form-label">Código único</label>
                        <input type="text" th:field="*{codigoUnico}" maxlength="10" class="form-control" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="*{codigoUnico}"></div>
                        <div class="form-text" th:text="${unidad.prefijoCodigo} + ' y 7 letras o números'">prefijo</div>
                    </div>
                    <div class="col-md-6">
                        <label for="superficie" class="form-label">Superficie (m²)</label>
                        <input type="number" step="0.01" min="0" th:field="*{superficie}" class="form-control"
                               th:errorclass="is-invalid" th:readonly="${!puede}"/>
                        <div class="invalid-feedback" th:errors="*{superficie}"></div>
                    </div>
                </div>

                <!-- solo Food Truck -->
                <div class="row g-3 mt-1" th:if="${unidad.tipoUnidad == 'Food Truck'}">
                    <div class="col-md-6">
                        <label for="patente" class="form-label">Patente</label>
                        <input type="text" th:field="*{patente}" class="form-control"/>
                    </div>
                    <div class="col-md-6 d-flex align-items-end">
                        <!-- se puede cambiar -->
                        <div class="form-check mb-2" th:if="${puede}">
                            <input type="checkbox" th:field="*{requiereElectricidad}" class="form-check-input"/>
                            <label class="form-check-label" for="requiereElectricidad1">Requiere conexión eléctrica</label>
                        </div>
                        <!-- bloqueado: el valor viaja escondido y el checkbox solo se muestra -->
                        <div class="form-check mb-2" th:unless="${puede}">
                            <input type="hidden" th:field="*{requiereElectricidad}"/>
                            <input type="checkbox" class="form-check-input" id="electricidadBloqueada"
                                   th:checked="*{requiereElectricidad}" disabled/>
                            <label class="form-check-label" for="electricidadBloqueada">Requiere conexión eléctrica</label>
                        </div>
                    </div>
                </div>

                <!-- solo Puesto -->
                <div class="row g-3 mt-1" th:unless="${unidad.tipoUnidad == 'Food Truck'}">
                    <div class="col-md-6">
                        <label for="cantidadCarpas" class="form-label">Cantidad de carpas</label>
                        <input type="number" min="1" th:field="*{cantidadCarpas}" class="form-control"/>
                    </div>
                    <div class="col-md-6">
                        <label for="tiempoMontaje" class="form-label">Tiempo de montaje (minutos)</label>
                        <input type="number" min="0" th:field="*{tiempoMontaje}" class="form-control"
                               th:readonly="${!puede}"/>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-dark">Guardar cambios</button>
                    <a th:href="@{/reportes/unidades(idFestival=${unidad.festival.idFestival})}"
                       class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </div>
        </form>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
