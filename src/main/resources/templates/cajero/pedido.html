<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-light">
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-5" style="max-width:720px">
        <h1 class="h3 mb-1">Nuevo pedido</h1>
        <p class="text-muted mb-4">
            Fecha: <span th:text="${#temporals.format(#temporals.createToday(), 'dd/MM/yyyy')}">hoy</span>.
            Indicá la cantidad de cada plato; los que quedan en 0 no se cargan.
        </p>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}">error</div>

        <div class="alert alert-warning" th:if="${platos != null and #lists.isEmpty(platos)}">
            Tu unidad todavía no tiene platos cargados.
        </div>

        <form th:action="@{/cajero/pedido}" method="post"
              th:if="${platos != null and !#lists.isEmpty(platos)}" class="card shadow-sm">
            <table class="table mb-0 align-middle">
                <thead class="table-light">
                    <tr><th>Plato</th><th class="text-end">Precio</th><th style="width:130px">Cantidad</th></tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${platos}">
                        <td th:text="${p.nombre}">plato</td>
                        <td class="text-end"
                            th:text="'$ ' + ${#numbers.formatDecimal(p.precioVenta,1,'POINT',2,'COMMA')}">0</td>
                        <td>
                            <!-- el id viaja oculto; la cantidad la escribe el responsable -->
                            <input type="hidden" name="idsPlatos" th:value="${p.idPlato}"/>
                            <input type="number" name="cantidades" value="0" min="0" class="form-control"/>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="card-body d-flex gap-2 justify-content-end">
                <a th:href="@{/cajero/pedidos}" class="btn btn-outline-secondary">Ver pedidos</a>
                <button type="submit" class="btn btn-dark">Cargar pedido</button>
            </div>
        </form>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
